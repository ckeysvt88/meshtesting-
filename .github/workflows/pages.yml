name: Test and deploy Mesh Field Lab
on:
  push:
    branches: [main, mesh-field-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm install --no-save --package-lock=false @playwright/test@1.58.2
      - run: |
          node tests/serve.js &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4321/meshtesting-/ -o /dev/null && break; sleep 1; done
          npx playwright test tests/browser.spec.cjs --browser chromium
      - if: github.ref == 'refs/heads/main'
        run: |
          mkdir _site
          cp index.html style.css app.js db.js domain.js guide.js map.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png _site/
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: publish
        uses: actions/deploy-pages@v4
  live:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.58.2
      - name: Verify published assets and offline behavior
        env:
          MESH_URL: https://ckeysvt88.github.io/meshtesting-/
        run: |
          curl -fsS --retry 8 --retry-all-errors "$MESH_URL" | grep -q "Mesh Field Lab"
          npx playwright test tests/browser.spec.cjs --browser chromium
  installability:
    if: github.ref == 'refs/heads/mesh-field-lab'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.58.2
      - name: Check Chrome installability on the live site
        env:
          MESH_URL: https://ckeysvt88.github.io/meshtesting-/
        run: npx playwright test tests/browser.spec.cjs --browser chromium --grep "installability checks"
