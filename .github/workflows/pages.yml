name: Test and deploy Mesh Field Lab
on:
  push:
    branches: [main, mesh-field-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm install --no-save --package-lock=false @playwright/test@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          node tests/serve.js &
          npx playwright test tests/browser.spec.cjs --browser chromium
      - if: github.ref == 'refs/heads/main'
        run: |
          mkdir _site
          cp index.html style.css app.js db.js domain.js guide.js map.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png _site/
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: publish
        uses: actions/deploy-pages@v4
